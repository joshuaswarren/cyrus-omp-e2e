name: CI
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Syntax-check JS
        run: for f in $(find src -name '*.js' 2>/dev/null); do node --check "$f"; done
      - name: Require CHANGELOG.md touched in PR
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"; else
            echo "::error::PR must update CHANGELOG.md"; exit 1; fi
